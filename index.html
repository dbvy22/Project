<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur de Budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Simulateur de Budget</h1>
      <button id="theme-toggle" class="btn-theme">🌙 Mode Nuit</button>
    </header>

    <div class="person-switcher">
      <button class="btn-person active" id="btn-person-denis" data-person="Denis">Denis</button>
      <button class="btn-person" id="btn-person-margot" data-person="Margot">Margot</button>
    </div>

    <section class="card revenus-card">
      <h2>💰 Revenus</h2>
      <div id="revenus-list" class="items-list"></div>
      <button class="btn-add" id="btn-add-revenu">+ Ajouter un revenu</button>
      <div class="total-line">Total revenus : <span id="total-revenus">0 €</span></div>
    </section>

    <div class="grid-2">
      <section class="card investissements-card">
        <h2>📈 Investissements</h2>
        <div id="investissements-list" class="items-list"></div>
        <button class="btn-add" id="btn-add-investissement">+ Ajouter</button>
        <div class="total-line">Total : <span id="total-investissements">0 €</span></div>
      </section>

      <section class="card epargne-card">
        <h2>🏦 Épargne</h2>
        <div id="epargne-list" class="items-list"></div>
        <button class="btn-add" id="btn-add-epargne">+ Ajouter</button>
        <div class="total-line">Total : <span id="total-epargne">0 €</span></div>
      </section>
    </div>

    <section class="card depenses-card">
      <h2>🧾 Dépenses fixes</h2>
      <div id="depensesFixes-categories"></div>
      <button class="btn-add" id="btn-add-categorie-fixes">+ Ajouter une catégorie</button>
      <div class="total-line">Total dépenses fixes : <span id="total-depensesFixes">0 €</span></div>
    </section>

    <section class="card depenses-card">
      <h2>🧾 Dépenses variables</h2>
      <div id="depensesVariables-list" class="items-list"></div>
      <button class="btn-add" id="btn-add-depenseVariable">+ Ajouter une dépense</button>
      <div class="total-line">Total dépenses variables : <span id="total-depensesVariables">0 €</span></div>
    </section>

    <section class="card summary-card">
      <h2>Flux du budget mensuel</h2>
      <div class="budget-chart-scroll">
        <svg id="budget-chart" class="budget-chart" role="img" aria-label="Diagramme des revenus et de leur répartition">
          <text class="chart-empty" x="50%" y="50%" text-anchor="middle">Ajoutez des montants pour afficher la répartition de votre budget.</text>
        </svg>
      </div>
    </section>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
